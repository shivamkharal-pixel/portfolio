<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Case Study - Shivam Kharal">
    <title>Case Study | Shivam Kharal</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/projects.css">
    <style>
        .case-study-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-3xl) var(--spacing-lg);
        }
        .case-study-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-blue);
            font-weight: 600;
            margin-bottom: var(--spacing-xl);
            transition: transform 0.3s ease;
        }
        .case-study-back:hover {
            transform: translateX(-5px);
        }
        .case-study-header {
            margin-bottom: var(--spacing-3xl);
        }
        .case-study-title {
            font-size: var(--font-size-5xl);
            margin-bottom: var(--spacing-sm);
        }
        .case-study-category {
            color: var(--accent-blue);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: var(--font-size-sm);
        }
        .case-study-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: var(--spacing-3xl);
            border: 1px solid rgba(0, 217, 255, 0.1);
        }
        .case-study-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-3xl);
        }
        .case-study-section {
            margin-bottom: var(--spacing-2xl);
        }
        .case-study-section h2 {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }
        .case-study-section p {
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .case-study-sidebar {
            background: rgba(0, 217, 255, 0.05);
            padding: var(--spacing-xl);
            border-radius: 16px;
            border: 1px solid rgba(0, 217, 255, 0.1);
            height: fit-content;
        }
        .sidebar-item {
            margin-bottom: var(--spacing-lg);
        }
        .sidebar-item h4 {
            color: var(--text-tertiary);
            font-size: var(--font-size-xs);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tech-tag {
            padding: 4px 12px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 4px;
            font-size: var(--font-size-xs);
            color: var(--accent-blue);
        }

        @media (max-width: 768px) {
            .case-study-grid {
                grid-template-columns: 1fr;
            }
            .case-study-title {
                font-size: var(--font-size-3xl);
            }
            .case-study-image {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Shivam Kharal</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="menu-overlay" id="menuOverlay"></div>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item"><a href="index.html" class="nav-link" data-page="home">Home</a></li>
                <li class="nav-item"><a href="projects.html" class="nav-link active" data-page="projects">Projects</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link" data-page="about">About</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link" data-page="contact">Contact</a></li>
                <li class="nav-item"><a href="#" class="nav-cta" onclick="event.preventDefault();">Resume</a></li>
            </ul>
        </div>
    </nav>

    <main class="case-study-container">
        <a href="projects.html" class="case-study-back">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M13 15L8 10L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Projects
        </a>

        <div id="caseStudyContent">
            <!-- Content will be injected by JavaScript -->
            <div class="text-center">
                <h2>Loading Case Study...</h2>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Shivam Kharal. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/case-study.js"></script>
</body>
</html>
