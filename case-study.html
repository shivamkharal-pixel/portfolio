<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Case Study - Shivam Kharal">
    <title>Case Study | Shivam Kharal</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="projects.css">
    <style>
        :root {
            --accent-blue: #00d9ff;
            --accent-purple: #7000ff;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-white: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a1a1a6;
            --text-tertiary: #86868b;
            
            --spacing-3xl: 80px;
            --transition-smooth: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Reading Progress Bar */
        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 4px;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            z-index: 9999;
            transition: width 0.1s ease;
        }

        /* Advanced Background Glows */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(80px);
            animation: glowFloat 20s infinite alternate;
        }
        .bg-glow-1 { top: -200px; right: -200px; background: radial-gradient(circle, rgba(112, 0, 255, 0.08) 0%, transparent 70%); }
        .bg-glow-2 { bottom: -200px; left: -200px; animation-delay: -5s; }

        @keyframes glowFloat {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        .case-study-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: var(--spacing-3xl) var(--spacing-lg);
            position: relative;
        }

        .case-study-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: var(--spacing-2xl);
            transition: var(--transition-smooth);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 100px;
            background: var(--card-bg);
            border: 1px solid var(--border-white);
        }
        .case-study-back:hover {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: translateX(-8px);
            background: rgba(0, 217, 255, 0.05);
        }

        .case-study-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: var(--spacing-sm);
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 30%, #555 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .case-study-category {
            color: var(--accent-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.75rem;
            margin-bottom: var(--spacing-md);
            display: block;
        }

        .case-study-image-wrapper {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            margin-bottom: var(--spacing-3xl);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-white);
        }
        .case-study-image {
            width: 100%;
            height: clamp(400px, 70vh, 800px);
            object-fit: cover;
            transition: transform 1s cubic-bezier(0, 0, 0.2, 1);
        }
        .case-study-image-wrapper:hover .case-study-image {
            transform: scale(1.05);
        }

        .case-study-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 100px;
        }

        .case-study-section {
            margin-bottom: 80px;
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition-smooth);
        }
        .case-study-section.active {
            opacity: 1;
            transform: translateY(0);
        }

        .case-study-section h2 {
            font-size: 2.2rem;
            margin-bottom: 24px;
            color: var(--text-primary);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .case-study-section h2::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-white), transparent);
        }

        .case-study-sidebar {
            position: sticky;
            top: 120px;
            height: fit-content;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border-white);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .tech-tag {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-white);
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            transition: var(--transition-smooth);
        }
        .tech-tag:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(0, 217, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Next Project Card */
        .next-project-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            padding: 60px;
            border-radius: 40px;
            border: 1px solid var(--border-white);
            margin-top: 100px;
            text-align: center;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .next-project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--accent-blue), transparent);
            opacity: 0;
            transition: var(--transition-smooth);
            z-index: 0;
        }
        .next-project-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-10px);
        }
        .next-project-card:hover::before {
            opacity: 0.05;
        }
        .next-project-card * { position: relative; z-index: 1; }

        @media (max-width: 1200px) {
            .case-study-grid {
                grid-template-columns: 1fr;
                gap: 60px;
            }
            .case-study-sidebar {
                position: static;
                padding: 30px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb {
            background: var(--border-white);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
    </style>
</head>

    <main class="case-study-container">
        <a href="projects.html" class="case-study-back">

        <div id="caseStudyContent">

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">

    <script src="data.js"></script>
    <script src="main.js"></script>

</body>
